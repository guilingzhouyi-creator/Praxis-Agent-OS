name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff mypy
      - run: ruff check src/ tests/
      - run: ruff format --check src/ tests/
      - run: mypy src/ --python-version 3.11 --ignore-missing-imports --allow-untyped-calls --allow-untyped-decorators

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[test]"
      - run: python -m pytest tests/test_kernel.py -x -q --tb=short
      - run: python -m pytest tests/test_layer_imports.py -x -q --tb=short
      - run: python -m pytest tests/test_config_loader.py -x -q --tb=short
      - run: python -m pytest tests/test_errors.py -x -q --tb=short
      - run: python -m pytest tests/test_misc.py -x -q --tb=short
      - run: python -m pytest tests/test_process.py -x -q --tb=short
      - run: python -m pytest tests/test_i18n.py -x -q --tb=short

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[test]"
      - run: python -m pytest tests/test_kernel.py tests/test_layer_imports.py tests/test_errors.py tests/test_misc.py tests/test_process.py tests/test_i18n.py --cov=src --cov-report=xml --cov-report=term -q
      - uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          fail_ci_if_error: false
