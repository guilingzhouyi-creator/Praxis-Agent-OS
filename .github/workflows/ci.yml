name: CI

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "locales/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  lint:
    # Non-gating style check: the full test gate runs in the Test workflow
    # (.github/workflows/test.yml). 713 pre-existing ruff findings are tracked
    # as debt in docs/design/archive/reviews/README.md and cleared in batches;
    # this job reports them without blocking merges.
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -e ".[test]"
      - name: Lint
        run: ruff check src/ tests/ || true
      - name: Format check
        run: ruff format --check src/ tests/ || true
