name: CI

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "locales/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  lint:
    # Gating style check on changed files: new or modified Python files must
    # pass ruff check + format before merge. Pre-existing findings in untouched
    # files (tracked as debt in docs/design/archive/reviews/README.md, cleared
    # in batches) do not block — full-tree ruff runs in the nightly job.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -e ".[test]"
      - name: Lint changed files (gating)
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            CHANGED=$(git diff --name-only "${{ github.event.pull_request.base.sha }}"...HEAD || true)
          else
            CHANGED=$(git diff --name-only HEAD~1 HEAD || true)
          fi
          FILES=$(printf '%s\n' "$CHANGED" | grep -E '\.py$' || true)
          if [ -n "$FILES" ]; then
            echo "Linting changed files:"
            printf '%s\n' "$FILES"
            ruff check $FILES --output-format=full
            ruff format --check $FILES
          else
            echo "no changed Python files — lint OK"
          fi

  audit:
    # Dependency vulnerability gate: pip-audit checks the installed tree
    # (project deps + [test] extras) against the PyPI advisory DB. The
    # editable install of praxis itself is skipped — it is not on PyPI.
    # Fails on any known vulnerable package, so upstream CVEs surface on
    # the PR that introduces them instead of silently shipping to main.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          pip install -e ".[test]"
          pip install pip-audit
      - name: Audit dependencies (pip-audit)
        run: pip-audit --skip-editable
        timeout-minutes: 5
