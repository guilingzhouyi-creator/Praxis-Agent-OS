name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff mypy
      - run: ruff check src/ tests/
      - run: ruff format --check src/ tests/
      - run: mypy src/ --python-version 3.11 --ignore-missing-imports --allow-untyped-calls --allow-untyped-decorators

  test-batch-1:
    needs: lint
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[test]"
      - name: Batch 1 — fast core (layer imports, kernel, services)
        run: python tests/runner.py test_layer_imports && python tests/runner.py test_kernel && python tests/runner.py test_persistence && python tests/runner.py test_tool_pipeline && python tests/runner.py test_errors && python tests/runner.py test_process && python tests/runner.py test_params_integrity

  test-batch-1-extended:
    needs: test-batch-1
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[test]"
      - run: pip install pytest pytest-mock pyyaml jinja2 websocket-client cryptography
      - name: L3 + L4 core tests
        run: |
          python tests/runner.py test_gatechain
          python tests/runner.py test_reputation
          python tests/runner.py test_memory
          python tests/runner.py test_cell
          python tests/runner.py test_auth
          python tests/runner.py test_credential_vault
          python tests/runner.py test_identity
          python tests/runner.py test_constitution
          python tests/runner.py test_vfs

  test-batch-2:
    needs: test-batch-1-extended
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[test]"
      - run: pip install pytest pytest-mock pyyaml jinja2 websocket-client cryptography
      - name: Batch 2 — slow extended
        run: python tests/runner.py test_r4_agent || true
        continue-on-error: true
      - name: Conventional checks
        run: python tests/runner.py test_convention || true
        continue-on-error: true

  coverage:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[test]"
      - run: pip install pytest-cov
      - run: python -m pytest tests/test_kernel.py tests/test_layer_imports.py tests/test_errors.py tests/test_misc.py tests/test_process.py tests/test_gatechain.py tests/test_reputation.py --cov=src --cov-report=xml --cov-report=term -q
      - uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          fail_ci_if_error: false
