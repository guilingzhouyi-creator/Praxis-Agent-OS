name: CI

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "locales/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -e ".[test]"
      - name: Lint
        run: ruff check src/ tests/

  test-fast:
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -e ".[test]"
      - name: Fast tests (Batch 1)
        run: python tests/runner.py

  test-extended:
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -e ".[test]"
      - name: Extended tests (Batch 2)
        run: python -m pytest tests/l3/memory/test_r4_agent.py tests/l3/memory/test_r4_agent_evolve.py tests/l3/discussion/test_convention.py tests/l3/cell/test_orchestration.py -v --tb=short -q

  typecheck:
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -e ".[test]" mypy
      - name: Type check
        run: mypy src/ --python-version 3.11 --ignore-missing-imports --allow-untyped-calls --allow-untyped-decorators
