name: Benchmark

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  bench-card:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[test]"
      - name: Run card benchmark
        run: python tests/benchmarks/bench_card.py
