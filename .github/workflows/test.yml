# NOMOS Praxis — CI Test Suite
# Runs on every push and pull request to main.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-mock
          pip install pyyaml jinja2 websocket-client
          pip install cryptography

      - name: Run kernel tests
        run: python -m pytest tests/test_kernel.py -v --tb=short

      - name: Run services tests
        run: python -m pytest tests/test_services.py -v --tb=short

      - name: Run tool tests
        run: |
          python -m pytest tests/test_praxis_gate_chain.py -v --tb=short
          python -m pytest tests/test_praxis_os_tools.py -v --tb=short
          python -m pytest tests/test_praxis_p0_tools.py -v --tb=short
          python -m pytest tests/test_praxis_p1_tools.py -v --tb=short
          python -m pytest tests/test_praxis_p2_tools.py -v --tb=short
          python -m pytest tests/test_praxis_statecharts.py -v --tb=short
          python -m pytest tests/test_praxis_tool_rings.py -v --tb=short
          python -m pytest tests/test_praxis_tools.py -v --tb=short

      - name: Run convention check
        run: python -m pytest tests/test_praxis_conventions.py -v --tb=short

      - name: Run integration test
        run: python -m pytest tests/test_integration.py -v --tb=short
        timeout-minutes: 2
        continue-on-error: true

      - name: Summary
        run: echo "✅ CI completed for Python ${{ matrix.python-version }}"
