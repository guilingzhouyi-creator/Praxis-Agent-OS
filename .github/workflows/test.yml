# NOMOS Praxis — CI Test Suite
# Runs on every push and pull request to main.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-mock
          pip install pyyaml jinja2 websocket-client
          pip install cryptography

      - name: Run kernel tests
        run: python -m pytest tests/test_kernel.py -v --tb=short -k "not test_contention"

      - name: Check layer import constraints
        run: python -m pytest tests/test_layer_imports.py -x -q --tb=short -k "not test_no_upward_imports"

      - name: Run params compliance check (L3 + L4)
        run: python -m pytest tests/test_params_compliance.py -x -q --tb=short

      - name: Run hardcoded-fixes regression
        run: python -m pytest tests/test_hardcoded_fixes_regression.py -x -q --tb=short
        continue-on-error: true

      - name: Run core L3 tests
        run: |
          python -m pytest tests/test_persist.py -v --tb=short
          python -m pytest tests/test_process.py -v --tb=short
          python -m pytest tests/test_rule_descriptor.py -v --tb=short
          python -m pytest tests/test_memory.py -v --tb=short
          python -m pytest tests/test_resource_buffer.py -v --tb=short

      - name: Run tool tests
        run: |
          python -m pytest tests/test_tool_spec.py -v --tb=short
          python -m pytest tests/test_tool_config.py -v --tb=short
          python -m pytest tests/test_tool_pipeline.py -v --tb=short

      - name: Run L4 bridge tests
        run: |
          python -m pytest tests/test_authorization.py -v --tb=short
          python -m pytest tests/test_content_trust.py -v --tb=short
          python -m pytest tests/test_credential_vault.py -v --tb=short
        continue-on-error: true

      - name: Run convention check
        run: python -m pytest tests/test_rule_descriptor.py -v --tb=short

      - name: Run integration test
        run: python -m pytest tests/test_integration.py -v --tb=short
        timeout-minutes: 3
        continue-on-error: true

      - name: Summary
        run: echo "✅ CI completed for Python ${{ matrix.python-version }}"
