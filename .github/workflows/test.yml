name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"

      - name: Layer import constraints
        run: python -m pytest tests/infra/test_layer_imports.py -x -q --tb=short -k "not test_no_upward_imports"

      - name: Params compliance
        run: python -m pytest tests/infra/test_params_compliance.py -x -q --tb=short

      - name: Hardcoded-fixes regression
        run: python -m pytest tests/infra/test_hardcoded_fixes_regression.py -x -q --tb=short
        continue-on-error: true

      - name: L1 Kernel
        run: python -m pytest tests/l1/test_kernel.py -x -q --tb=short

      - name: L2 Shell
        run: python -m pytest tests/l2/ -x -q --tb=short

      - name: L3 Cell + Tools
        run: |
          python -m pytest tests/l3/cell/ -x -q --tb=short
          python -m pytest tests/l3/tools/ -x -q --tb=short
          python -m pytest tests/l3/bus/ -x -q --tb=short
          python -m pytest tests/l3/config/ -x -q --tb=short

      - name: L3 Memory
        run: python -m pytest tests/l3/memory/ -x -q --tb=short -k "not r4"

      - name: L3 Discussion + SubAgent
        run: |
          python -m pytest tests/l3/discussion/ -x -q --tb=short
          python -m pytest tests/l3/subagent/ -x -q --tb=short

      - name: L4 Bridge
        run: python -m pytest tests/l4/test_sandbox.py -x -q --tb=short

      - name: Integration
        run: python -m pytest tests/integration/ -x -q --tb=short
        timeout-minutes: 5
        continue-on-error: true

      - name: Summary
        run: echo "CI completed for Python ${{ matrix.python-version }}"
