name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"

      # -n auto comes from pyproject addopts (parallel across files, serial
      # within a file via --dist loadfile). Small/quick steps pin -n 0 to
      # avoid xdist spawn overhead; directory steps keep the default -n auto.
      - name: Layer import constraints
        run: python -m pytest tests/infra/test_layer_imports.py -n 0 --maxfail=5 -q --tb=short

      - name: Params compliance
        run: python -m pytest tests/infra/test_params_compliance.py -n 0 --maxfail=5 -q --tb=short

      - name: Hardcoded-fixes regression
        run: python -m pytest tests/infra/test_hardcoded_fixes_regression.py -n 0 --maxfail=5 -q --tb=short

      - name: L1 Kernel
        run: python -m pytest tests/l1/test_kernel.py -n 0 --maxfail=5 -q --tb=short

      - name: L2 Shell
        run: python -m pytest tests/l2/ --maxfail=5 -q --tb=short

      - name: L3 Cell + Tools
        run: |
          python -m pytest tests/l3/cell/ --maxfail=5 -q --tb=short
          python -m pytest tests/l3/tools/ --maxfail=5 -q --tb=short --durations=15
          python -m pytest tests/l3/bus/ --maxfail=5 -q --tb=short
          python -m pytest tests/l3/config/ --maxfail=5 -q --tb=short

      - name: L3 Memory
        run: python -m pytest tests/l3/memory/ --maxfail=5 -q --tb=short -k "not r4"

      - name: L3 Discussion + SubAgent
        run: |
          python -m pytest tests/l3/discussion/ --maxfail=5 -q --tb=short
          python -m pytest tests/l3/subagent/ --maxfail=5 -q --tb=short

      - name: L4 Bridge
        run: python -m pytest tests/l4/test_sandbox.py -n 0 --maxfail=5 -q --tb=short

      - name: Integration
        run: python -m pytest tests/integration/ --maxfail=5 -q --tb=short
        timeout-minutes: 5

      - name: Summary
        run: echo "CI completed for Python ${{ matrix.python-version }}"
