# Card: Praxis Constantization Bootstrap — Scout scans kernel hardcoded values → Agent analyzes → propose solution
card:
  id: "self-const-001"
  intent: "Scan Praxis kernel/ for magic numbers outside params.py. Report findings."
  domain: "."
  mode: PARALLEL_ALL

phases:
  - name: scan
    mode: PARALLEL
    steps:
      - action: scout
        agent: scout
        target: "Search src/kernel/ for numeric literals >= 100 that are NOT in params.py. List file:line:value."
        params:
          prompt: "Search in src/kernel/ for any integer or float literals >= 100 that appear outside of params.py. These are potential magic numbers. Report each with file path, line number, and the value."

      - action: scout
        agent: scout
        target: "Search src/kernel/ for hardcoded timeouts, delays, TTLs. List file:line:value."
        params:
          prompt: "Search src/kernel/ for hardcoded timeout values (timeout=, deadline=, sleep(), ttl=, interval=, delay=). These should be in params.py. Report file:line:value."

      - action: scout
        agent: scout
        target: "Search src/kernel/ for hardcoded string config keys and paths. List file:line."
        params:
          prompt: "Search src/kernel/ for hardcoded string literals used as config keys, paths, or resource names (like 'tokens', 'workers', '/proc', '/sys'). These should be in params.py. Report file:line:string."

  - name: analyze
    mode: SEQUENTIAL
    steps:
      - action: think
        agent: reviewer
        target: "Analyze scout findings"
        params:
          prompt: |
            Review the scout findings from scanning src/kernel/ for hardcoded values.
            Categorize each finding:
            - HIGH: numeric literal >= 100 in kernel module code (not in params.py)
            - MEDIUM: hardcoded timeout/sleep/delay
            - LOW: hardcoded string key

            List the top 10 most impactful findings that should be moved to params.py first.
            For each, suggest the constant name.

  - name: report
    mode: SEQUENTIAL
    steps:
      - action: think
        agent: reader
        target: "Generate constantization report"
        params:
          prompt: |
            Based on the analysis, generate a structured report:
            1. Total hardcoded values found
            2. Severity breakdown (HIGH/MEDIUM/LOW)
            3. Top 10 most impactful findings with suggested params.py constant names
            4. Estimated effort to fix (number of files to modify)

            Format as markdown.
