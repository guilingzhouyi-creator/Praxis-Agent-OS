name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  max: 1
  exceed-action: QUEUE

jobs:
  test:
    runs-on: {ubuntu-24, x64, medium}
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: checkout
      - uses: setup-python
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"

      - name: Layer import constraints
        run: python -m pytest tests/infra/test_layer_imports.py -n 0 --maxfail=5 -q --tb=short

      - name: Params compliance
        run: python -m pytest tests/infra/test_params_compliance.py -n 0 --maxfail=5 -q --tb=short

      - name: Hardcoded-fixes regression
        run: python -m pytest tests/infra/test_hardcoded_fixes_regression.py -n 0 --maxfail=5 -q --tb=short

      - name: L1 Kernel
        run: python -m pytest tests/l1/ -n 4 --maxfail=5 -q --tb=short

      - name: L2 Shell
        run: python -m pytest tests/l2/ -n 4 --maxfail=5 -q --tb=short

      - name: L3 Cell + Tools
        run: |
          python -m pytest tests/l3/cell/ -n 4 --maxfail=5 -q --tb=short
          python -m pytest tests/l3/tools/ -n 4 --maxfail=5 -q --tb=short
          python -m pytest tests/l3/bus/ -n 4 --maxfail=5 -q --tb=short
          python -m pytest tests/l3/config/ -n 4 --maxfail=5 -q --tb=short

      - name: L3 Memory
        run: python -m pytest tests/l3/memory/ -n 4 --maxfail=5 -q --tb=short -k "not r4"

      - name: L3 Discussion + SubAgent
        run: |
          python -m pytest tests/l3/discussion/ -n 4 --maxfail=5 -q --tb=short
          python -m pytest tests/l3/subagent/ -n 4 --maxfail=5 -q --tb=short

      - name: L4 Bridge
        run: python -m pytest tests/l4/ -n 4 --maxfail=5 -q --tb=short

      - name: Integration
        run: python -m pytest tests/integration/ -n 4 --maxfail=5 -q --tb=short
        timeout-minutes: 5

      - name: Summary
        run: echo "CI completed for Python ${{ matrix.python-version }}"
