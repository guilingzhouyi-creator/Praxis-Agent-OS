# Agent OS — project configuration
# Copy to your project root and edit.
# Environment variables: ${VAR_NAME} is supported in string values.

# ── Kernel ──
kernel:
  allocator:
    tokens: 4096               # Default token budget per agent
    ring1: 32                   # Working memory slots
    ring2: 200                  # Short-term memory slots
    ring3: 1000                 # Long-term memory slots
  swapper:
    interval: 30                # Background pressure check (seconds)
  process:
    max_pid: 500                # Max processes before GC reaps oldest
    audit_max: 1000             # Process audit log entries
  syscall:
    audit_max: 5000             # Syscall audit trail max entries

# ── Cell ──
cell:
  terminal:
    workers: 4                  # Agent worker pool size
    poll: 0.05                  # Card poll interval
  scout:
    max_total: 16               # Global scout pool size
    max_per_agent: 4            # Max scouts per agent
    cache_ttl: 30               # Scout result cache TTL (s)
    session_timeout: 300        # Multi-turn scout session timeout
  card:
    timeout: 30                 # Card wait timeout (s)
  skills:                       # Per-Cell skill white-list (回灌到 Cell)
    # default: [skill-a, skill-b]   # bound to the default Cell; empty/absent → global pool
    auto_activate_builtin: true    # inject built-in skills into every session's system prompt

# ── Filesystem service ──
fs:
  watch_interval: 2.0            # fs_adapter watch polling interval (s); keep in sync with params/system.py FS_WATCH_INTERVAL

# ── Internationalization ──
language: en                      # Display language: en | zh-CN | ja | de (see locales/)

# ── LLM ──
llm:
  provider: ollama              # mock | ollama | openai | anthropic
  model: qwen2.5-coder:7b
  api_url: http://localhost:11434
  api_key: ""                   # ollama needs no key; use the matching env vars for cloud providers (OPENAI_API_KEY / DEEPSEEK_API_KEY, etc.)
  max_tokens: 2048              # keep in sync with params/api.py LLM_DEFAULT_MAX_TOKENS
  temperature: 0.3              # keep in sync with params/api.py LLM_DEFAULT_TEMPERATURE
  rate_limit: 10                # LLM API calls per second
  # effort_tiers:               # optional per-provider reasoning tier sets
  #   anthropic: [low, medium, high]   # overrides the static default table
  cache:                        # Per-provider prefix cache strategy
    defaults:
      optimize_prompt: true
      forward_user_id: false
      anthropic_format: false
    openai:
      optimize_prompt: true
      forward_user_id: true
    deepseek:
      optimize_prompt: true
      forward_user_id: true
    anthropic:
      optimize_prompt: false
      forward_user_id: true
      anthropic_format: true
    ollama:
      optimize_prompt: false

# ── Per-executor model specs (model_service cascade: overrides > model_spec > llm global) ──
# Consumed by resolve_dict("scout"|"l3a"|"l3a_subagent"|"subagent"|"r4_agent").
# `model` is omitted here so every executor inherits llm.model; set it per
# executor to diverge. reasoning_effort: none|low|medium|high;
# thinking_budget: token budget for reasoning (0 = provider default).
model_spec:
  scout:
    defaults:
      max_tokens: 2048
      temperature: 0.3
      reasoning_effort: none
      thinking_budget: 0
  l3a:
    defaults:
      max_tokens: 4096
      temperature: 0.7
      reasoning_effort: none
      thinking_budget: 0
  l3a_subagent:
    defaults:
      max_tokens: 2048
      temperature: 0.3
      reasoning_effort: none
      thinking_budget: 0
  subagent:
    defaults:
      max_tokens: 2048
      temperature: 0.3
      reasoning_effort: none
      thinking_budget: 0
  r4_agent:
    defaults:
      max_tokens: 2048
      temperature: 0.3
      reasoning_effort: none
      thinking_budget: 0
  strategies:
    # Named strategy packs — applied at runtime per executor:
    #   PUT /api/v2/model-spec/{name}/strategy  {"strategy": "deep"}
    #   DELETE /api/v2/model-spec/{name}/strategy   (restore defaults)
    # Keys override the executor's defaults (exact layer > defaults).
    fast:
      max_tokens: 2048
      temperature: 0.3
      reasoning_effort: none
      thinking_budget: 0
    balanced:
      max_tokens: 4096
      temperature: 0.5
      reasoning_effort: low
      thinking_budget: 2048
    deep:
      max_tokens: 8192
      temperature: 0.7
      reasoning_effort: high
      thinking_budget: 8192
    xhigh:
      max_tokens: 12288
      temperature: 0.7
      reasoning_effort: xhigh
      thinking_budget: 16384
    # max: {reasoning_effort: max, thinking_budget: 32768}  # only on models
    # that support the max tier (GPT-5.x, Claude Fable 5/Opus 5)
    # disabled: true  # set on any pack to make it non-applicable at runtime

# ── L3A session limits (0 = unlimited) ──
l3a:
  max_steps: 0                  # Tool-calling turns per prompt
  max_turns: 0                  # Total dialogue turns per session
  timeout: 0                    # Seconds per prompt (0 = no timeout)
  idle_timeout: 3600            # Auto-close idle session (seconds)
  archive_importance: 0.7       # Ring-3 archive importance threshold

# ── Devices ──
devices:
  - name: llm
    type: LLM
    rate_limit: 10
    description: LLM backend
  - name: filesystem
    type: STORAGE
    rate_limit: 100
    description: Local filesystem

# ── Constitution (action sets) ──
# These define which actions trigger territory checks, sandbox, gatechain, etc.
# Empty = enforcement disabled for that category.
constitution:
  file_actions: [read, read_file, grep, grep_search, list, list_dir, search, find, stat]
  modify_actions: [write, write_file, edit, replace, replace_string, delete, rename, create, create_file, format, run, run_in_terminal]
  gate_actions: [run_in_terminal, deploy, db_migrate, user_delete, delete_user, destroy]
  scout_blocked: [write, write_file, edit, replace, replace_string, delete, rename, create, create_file, format]

# ── GateChain ──
gatechain:
  danger_levels:
    deploy: 5
    db_migrate: 4
    user_delete: 5
    destroy: 5
    rollback: 4
    run_in_terminal: 3
    exec: 4
    delete: 3
    write: 2
    replace: 2
  escalation_danger: 4          # Tools with danger >= this trigger L3 notification
  risk_warn_threshold: 6        # G3 risk score threshold for WARN
  repeat_threshold: 5           # G5: N recent calls triggers REPORT
  high_freq_threshold: 3        # G5: same-tool count threshold
  history_limit: 10             # G5: recent calls to consider

# ── Tool rates (calls/minute) ──
tool_rates:
  ring_1: 60                    # Read-only tools: 60 calls/min
  ring_2_5: 20                  # Write tools: 20 calls/min
  ring_3: 5                     # Destructive tools: 5 calls/min

# ── Tool timeouts & detectors ──
tool:
  web_timeout: 15               # web_fetch / web_search timeout (s)
  search_timeout: 30            # grep/rg search timeout (s)
  terminal_timeout: 30          # run_in_terminal timeout (s)
  git_timeout: 30               # git operations timeout (s)
  build_timeout: 300            # build/test project timeout (s)
  pip_install_timeout: 120      # pip install timeout (s)
  npm_timeout: 120              # npm install timeout (s)
  pyright_timeout: 60           # pyright diagnostics timeout (s)
  compile_check_timeout: 10     # cargo/gcc compile check timeout (s)
  package_manager_timeout: 120  # apt/cargo package manager timeout (s)
  handler_timeout: 60           # tool handler execution timeout (s)
  build_detectors:              # build system auto-detection order
    - ["python", "-m", "build"]
    - ["cargo", "build"]
    - ["npm", "run", "build"]
  test_detectors:               # test framework auto-detection order
    - ["python", "-m", "pytest"]
    - ["cargo", "test"]
    - ["npm", "test"]

# ── HTN planner ──
htn:
  domain_prefix: app
  tools:
    analyze: analyze_code
    scout: scout_delegate
    read: read_file
    write: write_file
    create: create_file
    replace: replace_string_in_file
    extract: extract_method
    build: build_project
    test: test_project
    lint: lint
    review: review_code
    doc: generate_doc
    fix: create_file
    plan: create_file

# ── Card pool (external registries for card type distribution) ──
# No registry configured: when registries is empty, card_pool uses built-in types only.
card_pool:
  registries: []
  auto_sync: false
  sync_interval: 3600

# ── Cache ──
cache:
  max_entries: 500              # File cache entries
  max_size_mb: 10               # File cache size limit
  ttl: 60                       # File cache TTL (s)
  context_max: 200              # Context register entries

# ── Persistence (auto-save intervals) ──
persistence:
  auto_save: true
  interval: 30                  # Global persist interval (s)
  card_registry: 30             # Card registry auto-save (s)
  card_gate: 10                 # Card gate auto-save (s)
  pending_queue: 5              # Pending queue auto-save (s)
  issue_table: 10               # Issue table auto-save (s)
  approval_gate: 5              # Approval gate auto-save (s)
  sandbox_state: 0              # Sandbox state auto-save (0=disabled)
  todo_table: 30                # Todo table auto-save (s)
  transaction_area: 30          # Transaction area auto-save (s)
  statecharts: 30               # Statecharts auto-save (s)
  execution_results: 30         # Execution results auto-save (s)
  dialogue_session: 30          # Dialogue session auto-save (s)

# ── Agent Loop (tool-calling iterations in SettingsCenter) ──
# Compile-time defaults; runtime overrides via /api/v2/loop/config.
loop:
  max_steps: 50                 # Max tool-calling turns per card
  max_attempts: 3               # Max steps-exhausted continuation attempts
  tool_repeat_warn: 3           # Same tool N times → warn
  tool_repeat_stop: 4           # Same tool N times → stop loop
  coarse_repeat_nudge: 3        # Same action N times → nudge
  coarse_repeat_stop: 6         # Same action N times → stop
  verify_cadence: true          # Enable verify-cadence tracking
  continuation_nudge: true      # Enable continuation nudges

# ── Service timeouts (LSP, MCP, Shell, Vault) ──
services:
  lsp_manager_timeout: 5        # LSP server start/stop timeout (s)
  lsp_long_timeout: 30           # LSP diagnostics long timeout (s)
  lsp_diag_timeout: 30           # LSP diagnostic request timeout (s)
  mcp_bridge_timeout: 10         # MCP bridge timeout (s)
  mcp_bridge_long_timeout: 30    # MCP bridge long timeout (s)
  shell_session_timeout: 3       # Shell session kill timeout (s)
  pool_queue_timeout: 1          # Pool queue poll timeout (s)
  term_handler_timeout: 15       # Terminal handler timeout (s)
  term_handler_long_timeout: 30  # Terminal handler long timeout (s)
  gateway_queue_timeout: 30      # API gateway queue timeout (s)
  r4_agent_join_timeout: 5       # R4 agent join timeout (s)
  subagent_run_timeout: 120      # SubAgent run timeout (s)
  subagent_join_timeout: 30      # SubAgent join timeout (s)

# ── Content trust policies (provenance + trust scoring) ──
# Controls how content from different sources is trusted.
# Content below min_trust_for_recall won't appear in memory recall results.
# content_trust:
#   strict:
#     initial_scores:
#       tool: 0.9
#       agent: 0.7
#       human: 1.0
#       external: 0.1
#     decay_per_hour: 0.1
#     min_trust_for_recall: 0.5
#     deny_if_unverified: true

# ── Card types (defines available card natures) ──
# Users can define custom card types via API or YAML.
# Each type has: display name, phases, review policy, metadata schema.
# register_card_type() also available via CentralPlugin.
card_types:
  execution:
    display: "Execution Card"
    has_review: true
    phases: ["plan", "implement", "review"]
  review:
    display: "Review Card"
    has_review: true
    phases: ["review"]
  issue:
    display: "Issue Card"
    has_review: false
    phases: ["discuss", "converge"]
  inspection:
    display: "Inspection Card"
    has_review: false
    phases: ["inspect"]

# ── MCP servers (auto-imported at boot) ──
mcp:
  servers: []
    # - name: filesystem
    #   endpoint: "http://localhost:3500/mcp/v1"
    #   api_key: ""
    # - name: database
    #   endpoint: "http://localhost:3501/mcp/v1"
    # Replace localhost:3500/3501 with your MCP server address.

# ── R5 swarm-domain graph memory (semantic topology index layer, off by default) ──
# When enabled: memory writes auto-create edges (sequential/type_chain/cell_chain),
# with diffusion retrieval and graph-reduction reports. Zero impact when disabled (R1-R4 linear memory as usual).
memory:
  graph:
    enabled: false              # global toggle (overridable at Cell/session level)

# ── User profile side-channel ──
# When enabled, L3A/central decisions can reference a per-user model of
# preferences, domain focus and decision style (intent-parsing reference).
# Zero impact when disabled (bypass side-channel; original interactions intact).
user_profile:
  enabled: false

# ── Network mesh ──
network:
  discovery_port: 42069         # UDP broadcast port
  mesh_port: 42070              # TCP message port
  broadcast_interval: 15        # Announcement interval (s)
  peer_timeout: 60              # Peer dead after N seconds silent

# ── API gateway ──
api:
  host: 127.0.0.1
  port: 8080
  auth_token: ${PRAXIS_API_TOKEN}  # Bearer token (empty = no auth)
  mcp_mode: full                    # MCP export: normal | selected | full

# ── Territory → role mapping (paths must exist in this repo) ──
territories:
  reader:
    - src/l1
    - src/l2
    - docs
  writer:
    - src/l3
    - src/l4
  reviewer:
    - src/l5
    - config

# ── Clearance (role → ring) ──
clearance:
  reader: 1
  writer: 2
  reviewer: 3
  scout: 1
  l3: 3

# ── Prompt templates (optional overrides) ──
# Keys correspond to kernel/prompts.py built-in defaults.
# Uncomment to override; format variables depend on the key.
# prompts:
#   agent_loop.system: "You are an agent. Task: {task}"
#   agent_loop.system.reader: "You are the reader agent. Read files and report."
#   scout.system: "You are a scout. Investigate: {task}"
#   convention.system: "Custom convention prompt..."

# ── Shell commands (optional overrides) ──
# Keys correspond to kernel/commands.py built-in defaults.
# Uncomment to override help text, aliases, or argument schemas.
# commands:
#   mode:
#     help: "switch mode"
#     aliases: ["m"]
#   connect:
#     args:
#       - name: agent_id
#         description: "Target agent"
#         optional: false

# ── Agent defaults ──
agents:
  reader:
    max_scouts: 3
    ring: 1
  writer:
    max_scouts: 3
    ring: 2
  reviewer:
    max_scouts: 1
    ring: 3

# ── Think quota configuration ──
think:
  max_budget: 32768               # Global think budget hard limit (tokens)
  max_reasoning: "high"            # Maximum allowed reasoning_effort
  profiles:                        # Tiered by role (optional)
    default:  {max_budget: 4096}
    reader:   {max_budget: 2048}
    writer:   {max_budget: 8192}
    reviewer: {max_budget: 16384}

# ── Card Gate / Approval Workflow ──
card_gate:
  thresholds:
    small_max_files: 1
    small_max_lines: 50
    medium_max_files: 5
    medium_max_lines: 200
  auto_approval:
    small: true
    medium: true
    large: false
    disputed: false
  arch_keywords:                       # Optional: override architecture detection keywords
    - architecture
    - redesign
    - refactor
    - migration
    - restructure
    - 架构
    - 重构
    - 重设计

# ── Diff / Structured Sandbox Color Scheme ──
diff:
  mode: auto                       # auto|human|summary|colored
  heavy_api_enabled: false         # Enable heavy diff API endpoints
  # heavy_api_port: 8090
  colors:                          # ANSI color codes per semantic type (override)
    logic_change: "\033[31m"       # red
    reformat: "\033[34m"           # blue
    comment_only: "\033[32m"       # green
    import_change: "\033[33m"      # yellow
    import_added: "\033[33m"       # yellow
    rename: "\033[36m"             # cyan
    structural: "\033[90m"         # bright black
    mixed: "\033[35m"              # magenta
    added: "\033[32m"              # green
    removed: "\033[31m"            # red
