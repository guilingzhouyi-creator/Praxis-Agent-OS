# commands.yaml — L2 Shell command definitions
# Category: session|control|memory|system|agent|audit|ext

help:
  category: session
  help: "Show available commands"
  examples:
    - "/help              — list all commands"
    - "/help memory       — show memory command details"
    - "/help tokens       — show token command details"

agents:
  category: session
  help: "List all agents"
  aliases: ["ls"]
  examples:
    - "/agents            — list all agents across cells"

connect:
  category: session
  help: "Connect to an agent (direct mode)"
  args:
    - {name: agent_id, completer: agent, description: "Target agent ID"}
    - {name: "--role", completer: role, optional: true, description: "Filter by role"}
  examples:
    - "/connect agent-writer          — connect to an agent"
    - "/connect agent-reader --role reader — connect filtered by role"

disconnect:
  category: session
  help: "Disconnect and return to L3A"
  aliases: ["dc"]
  examples:
    - "/disconnect         — end direct session"

mode:
  category: session
  help: "Show/switch mode (L3A/Direct, tool read/write)"
  args:
    - {name: sub, optional: true, description: "'tool' for tool mode"}
    - {name: tool_mode, optional: true, description: "read|write|toggle"}
  examples:
    - "/mode               — show current mode"
    - "/mode tool toggle   — toggle tool mode"

status:
  category: session
  help: "Show Cell, agent, and session status"
  args:
    - {name: cell_id, optional: true, completer: agent, description: "Cell ID"}
  examples:
    - "/status             — show current session status"

intents:
  category: control
  help: "List recent intents (CentralController)"
  args:
    - {name: status, optional: true, description: "Filter by status"}
  examples:
    - "/intents            — list all intents"
    - "/intents pending    — filter by status"

scheduler:
  category: control
  help: "Show 5D scheduling status (CentralScheduler)"
  examples:
    - "/scheduler          — show scheduler stats"

think:
  category: control
  help: "Inspect or configure think quotas (ThinkRegistry)"
  args:
    - {name: sub, optional: true, description: "status — show all quotas"}
  examples:
    - "/think              — show think quota cells"
    - "/think status       — show all think quotas"

observe:
  category: control
  help: "Observability: alerts/health/metrics"
  args:
    - {name: kind, optional: true, description: "alert|health|metric|audit"}
  examples:
    - "/observe            — show health (default)"
    - "/observe metric     — show metrics"

skills:
  category: control
  help: "List/view/evolve R4Agent skills"
  args:
    - {name: sub, optional: true, description: "list|lean|evolve <intent>"}
  examples:
    - "/skills             — list skills"
    - "/skills evolve add input validation — evolve a skill"

cells:
  category: control
  help: "List cells or show cell health (CellMonitor)"
  args:
    - {name: cell_id, optional: true, description: "Cell ID or 'list'"}
  examples:
    - "/cells              — list all cells"
    - "/cells cell-1       — show cell events"

cross:
  category: control
  help: "Cross-cell coordination status (L3B)"
  examples:
    - "/cross              — show cross-cell routing status"

security:
  category: control
  help: "Security stats or run a check"
  args:
    - {name: sub, optional: true, description: "stats|check <action> <agent>"}
  examples:
    - "/security           — show security stats"
    - "/security check read_file agent-writer — run a security check"

memory:
  category: memory
  help: "Memory operations across agents/cells/global"
  aliases: ["mem"]
  args:
    - {name: "--cell", optional: true, completer: cell, description: "Cell ID scope"}
    - {name: "--agent", optional: true, completer: agent, description: "Agent ID scope"}
    - {name: op, optional: true, description: "stats|recall|store|compact|archive|forget|ring"}
  examples:
    - "/memory                        — global memory stats"
    - "/memory --agent agent-writer stats — per-agent stats"
    - "/memory --cell cell-1 compact   — compact all agents in a cell"
    - "/memory recall 'port config'   — search memory"
    - '/memory store 3 "use port 2222 for SSH" — store to Ring 3'
    - "/status | /memory --agent {scope_id} stats — pipeline: status → memory"

plugins:
  category: control
  help: "List installed plugins (CentralPlugin)"
  args:
    - {name: sub, optional: true, description: "list|stats"}
  examples:
    - "/plugins            — list plugins"

mcp:
  category: control
  help: "Manage MCP connections + server export mode"
  args:
    - {name: sub, optional: true, description: "status|mode|add|remove|disable|enable"}
  examples:
    - "/mcp                — MCP server status + export mode"
    - "/mcp mode full      — switch export: normal|selected|full"
    - '/mcp add my-server http://YOUR_MCP_HOST:PORT/mcp/v1 — add server'

process:
  category: system
  help: "List running processes"
  aliases: ["ps"]
  args:
    - {name: pid, optional: true, description: "Filter by PID"}
  examples:
    - "/process            — list all processes"
    - "/process 3          — show PID 3 details"

vfs:
  category: system
  help: "Virtual filesystem navigation (VFS)"
  args:
    - {name: path, optional: true, description: "Path (default: /)"}
    - {name: "--mounts", optional: true, description: "List mount points"}
  examples:
    - "/vfs                — list VFS root"
    - "/vfs /proc          — list /proc"
    - "/vfs --mounts       — list mount points"

cache:
  category: system
  help: "Show cache statistics"
  args:
    - {name: sub, optional: true, description: "stats|clear"}
  examples:
    - "/cache              — show cache stats"
    - "/cache clear        — clear all caches"

sysinfo:
  category: system
  help: "System information summary"
  aliases: ["info"]
  examples:
    - "/sysinfo            — show system summary"

clear:
  category: system
  help: "Clear the terminal screen"
  aliases: ["clr"]
  examples:
    - "/clear              — clear screen"

history:
  category: system
  help: "Show shell command history"
  aliases: ["hist"]
  args:
    - {name: limit, optional: true, description: "Number of entries (default: 20)"}
  examples:
    - "/history            — show last 20 commands"
    - "/history 50         — show last 50"

lang:
  category: system
  help: "Show or switch display language"
  args:
    - {name: locale, optional: true, description: "en, zh-CN, etc. Omit to show current"}
  examples:
    - "/lang               — show current language"
    - "/lang zh-CN         — switch to Chinese"

spawn:
  category: agent
  help: "Create a new agent in a Cell"
  args:
    - {name: role, completer: role, description: "writer|reader|security|scout"}
    - {name: agent_id, optional: true, description: "Agent ID (auto if omitted)"}
    - {name: "--cell", optional: true, description: "Target Cell ID"}
  examples:
    - "/spawn writer       — spawn a writer agent"
    - '/spawn scout my-scout-1 --cell cell-2 — spawn in specific cell'

kill:
  category: agent
  help: "Terminate an agent in a Cell"
  args:
    - {name: agent_id, completer: agent, description: "Agent ID"}
  examples:
    - "/kill agent-writer  — terminate agent-writer"

destroy:
  category: agent
  help: "Remove an entire Cell and all its agents"
  args:
    - {name: cell_id, description: "Cell ID"}
  examples:
    - "/destroy cell-1     — destroy cell-1 and all agents"

emergency:
  category: agent
  help: "Emergency stop — halt all operations"
  aliases: ["halt"]
  args:
    - {name: cell_id, optional: true, description: "Cell ID (default: cell-1)"}
  examples:
    - "/emergency          — emergency stop cell-1"

cluster:
  category: agent
  help: "Show cluster topology and Cell health"
  examples:
    - "/cluster            — show cluster topology"

htn:
  category: debug
  help: "View HTN instance status (a | b | c)"
  examples:
    - "/htn a             — HTN-A: global decomposer"
    - "/htn b             — HTN-B: cross-cell routing"
    - "/htn c             — HTN-C: in-cell decomposition"

audit:
  category: audit
  help: "View syscall audit trail"
  args:
    - {name: limit, optional: true, description: "Number of entries (default: 20)"}
  examples:
    - "/audit              — show last 20 audit entries"
    - "/audit 100          — show last 100"

settings:
  category: audit
  help: "View runtime system settings"
  examples:
    - "/settings           — show system settings"

devices:
  category: audit
  help: "List registered kernel devices"
  examples:
    - "/devices            — list kernel devices"

tools:
  category: audit
  help: "List all registered tools"
  args:
    - {name: category, optional: true, description: "Filter by category"}
  examples:
    - "/tools              — list all tools"
    - "/tools file         — list file tools"

config:
  category: audit
  help: "View or reload system configuration"
  args:
    - {name: sub, optional: true, description: "show|reload"}
  examples:
    - "/config             — show current config"
    - "/config reload      — reload config from praxis.yaml"

cron:
  category: ext
  help: "Manage cron schedules"
  args:
    - {name: sub, optional: true, description: "list|add|remove"}
  examples:
    - "/cron               — list schedules"
    - '/cron add nightly "0 3 * * *" run_backup — add cron job'
    - "/cron remove nightly — remove cron job"

buffer:
  category: ext
  help: "Resource buffer management (stage/commit/diff/discard)"
  aliases: ["bf"]
  args:
    - {name: sub, description: "status|commit <path>|diff <path>|discard <path>"}
  examples:
    - "/buffer             — show buffer status"
    - "/buffer commit src/main.py — commit buffered changes"
    - "/buffer diff src/main.py   — show pending diff"
    - "/buffer discard src/main.py — discard buffered changes"

card:
  category: ext
  help: "Manage card pool: install, list, search, export, remove"
  aliases: ["c"]
  args:
    - {name: sub, description: "list|install <url>|install-file <path>|search <q>|export <name>|remove <name>"}
  examples:
    - "/card               — list installed cards"
    - '/card install https://CARD_REGISTRY_URL/deploy.yaml — install from URL'
    - '/card search deploy  — search remote registries'

cell_create:
  category: agent
  help: "Create a new Cell with 3 Peer Agents"
  aliases: ["cc"]
  args:
    - {name: territory, description: "Territory path"}
  examples:
    - "/cell_create /home/projects — create cell for territory"

agent_refresh:
  category: agent
  help: "Reset an agent's context (clear pollution)"
  args:
    - {name: agent_id, description: "Agent ID"}
  examples:
    - "/agent_refresh agent-writer — reset agent context"

agent_restart:
  category: agent
  help: "Restart an agent (shutdown + clear memory + reboot)"
  args:
    - {name: agent_id, description: "Agent ID"}
  examples:
    - "/restart agent-writer — full agent restart"

model:
  category: control
  help: "Manage LLM model providers and model specs"
  args:
    - {name: sub, description: "list|status|switch|health|set"}
    - {name: role, optional: true, description: "peer_agent|subagent|scout|r4_agent|convention|card_planner|l3a"}
    - {name: value, optional: true, description: "Provider name or key=value"}
  examples:
    - "/model list               — list registered providers"
    - "/model status              — show all model specs"
    - "/model switch scout ollama qwen2.5-coder:1.5b — switch scout model"
    - "/model health openai       — test provider connectivity"

tokens:
  category: audit
  help: "Query token usage (global/cell/agent)"
  aliases: ["tk"]
  args:
    - {name: "--cell", optional: true, completer: cell, description: "Cell ID"}
    - {name: "--agent", optional: true, completer: agent, description: "Agent ID"}
    - {name: sub, optional: true, description: "global|cells"}
  examples:
    - "/tokens                  — global token usage"
    - "/tokens --cell cell-1    — per-cell"
    - "/tokens --agent agent-w  — per-agent"
    - "/status | /tokens --agent {scope_id} — pipeline"

stats:
  category: system
  help: "Query StatsCenter: tool calls, compression savings, per-Cell/Agent metrics"
  args:
    - {name: sub, description: "tools|compression|cell|agent|cells|top"}
    - {name: scope, optional: true, completer: cell, description: "global|cell <id>|agent <id>"}
    - {name: window, optional: true, description: "Time window: 1m|5m|1h|all (default: 5m)"}
  examples:
    - "/stats tools                       — tool calls, all cells, 5m"
    - "/stats tools cell cell-1 1h        — tool calls for cell-1, 1h"
    - "/stats compression                 — compression token savings, global"
    - "/stats compression cell cell-1     — per-cell compression"
    - "/stats cell cell-1                 — all metrics + PMU live for cell-1"
    - "/stats agent agent-writer          — per-agent tool/token detail"
    - "/stats cells                       — all Cells summary"
    - "/stats top tools.executed.ring_1   — cross-Cell ranking"

# ── SubAgent spec definitions (loaded by subagent_spec.py) ──
# Each entry maps to a SubAgentSpec dataclass.
# Overrides the built-in defaults in subagent_spec.py.

subagent_specs:
  security-auditor:
    description: "Security code review — scan for OWASP Top 10, hardcoded secrets, injection vectors"
    allowed_tools: [read_file, grep_search, list_dir]
    max_steps: 8
    timeout: 120.0
    tags: [security, review]
  code-reviewer:
    description: "General code review — logic errors, style, test coverage, edge cases"
    allowed_tools: [read_file, grep_search, list_dir]
    max_steps: 8
    timeout: 120.0
    tags: [review]
  documenter:
    description: "Generate documentation from code — docstrings, README, API reference"
    allowed_tools: [read_file, list_dir]
    max_steps: 6
    timeout: 90.0
    tags: [docs]
  data-analyst:
    description: "Analyze data files, logs, or structured output for patterns and anomalies"
    allowed_tools: [read_file, grep_search]
    max_steps: 6
    timeout: 90.0
    tags: [data]
  architect:
    description: "Architecture review — dependency analysis, module boundaries, design patterns"
    allowed_tools: [read_file, grep_search, list_dir]
    max_steps: 10
    timeout: 180.0
    tags: [architecture, review]
  helper:
    description: "General-purpose assistant — answer questions, explain code, suggest fixes"
    allowed_tools: [read_file, grep_search, list_dir]
    max_steps: 5
    timeout: 60.0
    tags: [general]
  refactor-agent:
    description: "Refactor code — rename symbols, extract methods, split files, apply patterns"
    allowed_tools: [read_file, grep_search, list_dir, edit, write_file]
    max_steps: 12
    timeout: 180.0
    tags: [refactor, write]
  fixer:
    description: "Fix bugs and issues — read error, locate cause, apply fix, verify"
    allowed_tools: [read_file, grep_search, list_dir, edit, write_file, shell]
    max_steps: 10
    timeout: 180.0
    tags: [fix, write]

settings:
  category: system
  help: "Multi-level settings management — global/cell/agent/pool"
  args:
    - {name: scope, description: "global|cell <id>|agent <id>|pool [scout|subagent]"}
    - {name: action, optional: true, description: "set|list"}
    - {name: key, optional: true}
    - {name: value, optional: true}
  examples:
    - "/settings global set loop.max_steps 10"
    - "/settings cell cell-1"
    - "/settings agent agent-a"
    - "/settings pool scout"
  aliases: ["cfg"]

l3a:
  category: session
  help: "L3A session management — create/list/info/close sessions, model config, context"
  args:
    - {name: subcommand, description: "create|list|info|close|messages|model|context"}
    - {name: arg, optional: true, description: "session_id, title, or model key=value"}
  examples:
    - "/l3a                            — show active sessions + model"
    - "/l3a create                     — create a new session"
    - "/l3a create \"My Task\"           — create with title"
    - "/l3a resume <archived_id>       — resume an archived session from R4"
    - "/l3a list                       — list active + archived sessions"
    - "/l3a info <id>                  — show session + epoch details"
    - "/l3a close <id>                 — close and archive session"
    - "/l3a messages <id> [limit]      — paginate through messages"
    - "/l3a tasks <id> [status]        — session card task table (watcher buffer)"
    - "/l3a todos <id>                  — session TODO table (LLM task list)"
    - "/l3a compress <id> [keep_last]   — compress history into summary (default keep 10)"
    - "/l3a memory [id] [window]        — R1-R3 ring usage + ingress rate (default 1h)"
    - "/l3a model show                 — show effective model config"
    - "/l3a model set provider openai  — override L3A model provider"
    - "/l3a model set model gpt-4o     — override L3A model"
    - "/l3a context sources            — list registered context sources"
