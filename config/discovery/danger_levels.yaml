# Tool danger level labels and gate/ring mappings.
# Auto-discovered by ConfigDiscovery; overlays params/tool.py and params/kernel.py.

# ── Danger level labels (level → name) ──
danger_levels:
  0: read_only
  1: safe_write
  2: dangerous
  3: destructive

# ── Danger level → gate requirements ──
danger_to_gates:
  0: [G1, G2]
  1: [G1, G2, G3, G4]
  2: [G1, G2, G3, G4]
  3: [G1, G2, G3, G4, G5]

# ── Tool ring → gate requirements ──
ring_gates:
  RING_1:   [G1, G2]
  RING_2_5: [G1, G2, G3, G4]
  RING_3:   [G1, G2, G3, G4, G5]

# ── Ring number ↔ name maps ──
ring_num_map:
  RING_1: 1
  RING_2_5: 2
  RING_3: 3

ring_name_map:
  1: RING_1
  2: RING_2_5
  3: RING_3

# ── GateChain action-level danger ratings (action → danger level) ──
gatechain_danger_levels:
  deploy: 5
  db_migrate: 4
  user_delete: 5
  destroy: 5
  rollback: 4
  migrate: 4
  exec: 4
  run_in_terminal: 3
  execute: 3
  delete: 3
  write: 2
  replace: 2
  format: 2

# ── GateChain pattern template ──
gatechain_pattern_template: "G1-{g1}_G3-{g3}"
