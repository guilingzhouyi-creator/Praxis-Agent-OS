[project]
name = "praxis"
version = "0.4.1"
description = "Praxis — Agent OS (headless core)"
requires-python = ">=3.11"
dependencies = [
    "PyYAML>=6.0",
    "Jinja2>=3.0",
    "websocket-client>=1.0",
    "websockets>=13",
    "cryptography>=41.0",
]

[project.optional-dependencies]
test = [
    "pytest>=9.1.1",
    "pytest-cov>=4.0",
    "pytest-mock>=3.12",
    "pytest-xdist>=3.6",
    "ruff>=0.9",
    "pre-commit>=3.0",
]

[project.scripts]
praxis = "main:main"
praxis-kernel = "l4.supervisor:start_kernel"
praxis-api = "l4.supervisor:start_api"
praxis-sandbox = "l4.sandbox.server:main"
praxis-llm = "l4.llm_worker.server:main"
praxis-supervisor = "l4.supervisor:main"

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["src"]
addopts = "-v --tb=short --strict-markers -W ignore::DeprecationWarning -n auto --dist loadfile"
# -n auto: use all idle CPU cores (xdist). --dist loadfile: parallel across
# files, serial within a file (keeps same-file port bindings safe).

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RET"]
ignore = ["E501", "N812", "SIM117"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
allow_untyped_calls = true
allow_untyped_decorators = true
warn_unused_ignores = true
no_implicit_optional = true
check_untyped_defs = false

[tool.coverage.run]
source = ["src"]
omit = ["tests/*"]

[tool.coverage.report]
fail_under = 60
