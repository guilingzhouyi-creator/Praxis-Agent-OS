[project]
name = "nomos-praxis"
version = "0.3.0"
description = "NOMOS Praxis — Agent OS (headless core)"
requires-python = ">=3.11"
dependencies = [
    "PyYAML>=6.0",
    "Jinja2>=3.0",
    "websocket-client>=1.0",
    "cryptography>=41.0",
]

[project.optional-dependencies]
test = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[project.scripts]
praxis = "main:main"
praxis-kernel = "services.supervisor:start_kernel"
praxis-api = "services.supervisor:start_api"
praxis-sandbox = "services.sandbox.server:main"
praxis-llm = "services.llm_worker.server:main"
praxis-supervisor = "services.supervisor:main"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["src"]
addopts = "-v --tb=short -W ignore::DeprecationWarning"

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RET"]
ignore = ["E501", "N812", "SIM117"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
allow_untyped_calls = true
allow_untyped_decorators = true
warn_unused_ignores = true
no_implicit_optional = true
check_untyped_defs = false

[tool.coverage.run]
source = ["src"]
omit = ["tests/*"]
